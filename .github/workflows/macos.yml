name: macOS build

# There is no way to cross-compile or test a macOS build from Linux: depends
# needs an Apple-licensed SDK, and a .app cannot be executed off a Mac. So the
# macOS wallet is built and smoke-tested here, on a real macOS runner, and the
# result is published as a build artifact.

on:
  push:
    branches: [ ixcoin-core-0.14.1, master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon only. GitHub has retired the macOS 13 Intel image, so
          # a macos-13 job is accepted and then queues forever without ever
          # being assigned a runner -- it never fails, it just never starts.
          # An x86_64 build now needs either cross-compilation from this runner
          # (which could not be smoke-tested here) or a self-hosted Intel Mac.
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # The C++ source lives under ixcoin-core/, not at the repository root.
    defaults:
      run:
        working-directory: ixcoin-core

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install automake libtool pkg-config libevent openssl@3 boost qt@5 protobuf

      # Homebrew dropped berkeley-db@4, and the newer formulae are not a
      # substitute: BDB 5 writes a different on-disk format, so a wallet.dat
      # produced here would not open in any other iXcoin Core build. Build 4.8
      # from source instead, the way Bitcoin's own release process does.
      - name: Build Berkeley DB 4.8
        run: |
          set -euxo pipefail
          BDB_PREFIX="$HOME/bdb4"
          mkdir -p "$BDB_PREFIX" && cd "$(mktemp -d)"
          curl -fsSLO https://download.oracle.com/berkeley-db/db-4.8.30.NC.tar.gz
          echo "12edc0df75bf9abd7f82f821795bcee50f42cb2e5f76a6a281b85732798364ef  db-4.8.30.NC.tar.gz" | shasum -a 256 -c -
          tar xzf db-4.8.30.NC.tar.gz
          cd db-4.8.30.NC
          # 4.8 predates C11 <stdatomic.h>; these names now collide with the
          # compiler builtins.
          sed -i '' 's/__atomic_compare_exchange/__atomic_compare_exchange_db/' dbinc/atomic.h
          sed -i '' 's/atomic_init/atomic_init_db/' dbinc/atomic.h mp/mp_region.c mp/mp_mvcc.c mp/mp_fget.c mutex/mut_method.c mutex/mut_tas.c
          cd build_unix
          # 4.8 predates arm64 Darwin, so its mutex probe (which compiles *and
          # runs* a test) finds nothing and it errors out instead of falling
          # back. Name the implementation explicitly; macOS is pthreads.
          ../dist/configure --enable-cxx --disable-shared --with-pic \
            --disable-replication --with-mutex=POSIX/pthreads \
            --prefix="$BDB_PREFIX"
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Configure
        run: |
          set -euxo pipefail
          BDB_PREFIX="$HOME/bdb4"
          SSL_PREFIX="$(brew --prefix openssl@3)"
          BOOST_PREFIX="$(brew --prefix boost)"
          QT_PREFIX="$(brew --prefix qt@5)"
          # Homebrew's prefix is /opt/homebrew on Apple silicon and /usr/local
          # on Intel, and clang searches neither by default -- which is why
          # configure could not find boost/version.hpp and reported it as "no
          # working boost sleep implementation".
          BREW_PREFIX="$(brew --prefix)"
          export PKG_CONFIG_PATH="$SSL_PREFIX/lib/pkgconfig:$QT_PREFIX/lib/pkgconfig:$BREW_PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export PATH="$QT_PREFIX/bin:$PATH"
          ./autogen.sh
          ./configure \
            --with-gui=qt5 \
            --disable-tests \
            --disable-bench \
            --with-boost="$BOOST_PREFIX" \
            BDB_CFLAGS="-I$BDB_PREFIX/include" \
            BDB_LIBS="-L$BDB_PREFIX/lib -ldb_cxx-4.8" \
            CXXFLAGS="-std=c++17" \
            ax_cv_boost_system=yes \
            BOOST_SYSTEM_LIB="" \
            CPPFLAGS="-I$BDB_PREFIX/include -I$SSL_PREFIX/include -I$BOOST_PREFIX/include -I$BREW_PREFIX/include" \
            LDFLAGS="-L$BDB_PREFIX/lib -L$SSL_PREFIX/lib -L$BOOST_PREFIX/lib -L$BREW_PREFIX/lib"

      # configure reports "No working boost sleep implementation found" for any
      # failure in that probe, and the actual compiler error only exists in
      # config.log — which is not otherwise visible from a CI run.
      - name: Show config.log on failure
        if: failure()
        run: |
          echo "=== boost sleep probe ==="
          awk '/sleep_for/,0' config.log | grep -E "error:|undefined|ld:" | head -40 || true
          echo "=== last 80 lines ==="
          tail -80 config.log || true

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Smoke test
        run: |
          set -euxo pipefail
          # 0.14 treats --version as "not starting the daemon" and exits 1,
          # so under set -e this would fail a perfectly good build.
          ./src/ixcoind --version || true
          ./src/ixcoin-cli --version || true
          DD="$(mktemp -d)"
          printf 'regtest=1\nserver=1\nrpcuser=t\nrpcpassword=t\nlisten=0\nrpcport=18557\n' > "$DD/ixcoin.conf"
          ./src/ixcoind -datadir="$DD" -daemon
          for i in $(seq 1 30); do
            ./src/ixcoin-cli -datadir="$DD" -rpcport=18557 -rpcuser=t -rpcpassword=t getblockchaininfo >/dev/null 2>&1 && break
            sleep 2
          done
          CLI="./src/ixcoin-cli -datadir=$DD -rpcport=18557 -rpcuser=t -rpcpassword=t"
          $CLI getblockchaininfo
          $CLI getnetworkinfo | grep subversion
          # The wallet and the miner must both work, not just the daemon start.
          ADDR="$($CLI getnewaddress)"
          $CLI generatetoaddress 1 "$ADDR"
          test "$($CLI getblockcount)" = "1"
          $CLI stop

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ixcoin-macos-${{ matrix.arch }}
          path: |
            ixcoin-core/src/ixcoind
            ixcoin-core/src/ixcoin-cli
            ixcoin-core/src/ixcoin-tx
            ixcoin-core/src/qt/ixcoin-qt

          if-no-files-found: warn
