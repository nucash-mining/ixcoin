name: macOS build

# There is no way to cross-compile or test a macOS build from Linux: depends
# needs an Apple-licensed SDK, and a .app cannot be executed off a Mac. So the
# macOS wallet is built and smoke-tested here, on a real macOS runner, and the
# result is published as a build artifact.

on:
  push:
    branches: [ ixcoin-core-0.14.1, master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13     # x86_64
            arch: x86_64
          - runner: macos-14     # Apple silicon
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # The C++ source lives under ixcoin-core/, not at the repository root.
    defaults:
      run:
        working-directory: ixcoin-core

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install automake libtool pkg-config libevent qt@5 openssl@3

      # Homebrew ships boost 1.8x, where boost::system became header-only (1.69)
      # and libboost_system no longer exists -- which this 2017 codebase links
      # against, so configure fails with "Could not find a version of the
      # boost_system library". 1.68 is the last release that still builds it,
      # and pinning boost also matches what the Linux and Windows releases get
      # from the depends system, so all platforms share one version.
      - name: Build boost 1.68
        run: |
          set -euxo pipefail
          BOOST_PREFIX="$HOME/boost168"
          mkdir -p "$BOOST_PREFIX" && cd "$(mktemp -d)"
          curl -fsSLO https://archives.boost.io/release/1.68.0/source/boost_1_68_0.tar.bz2
          echo "7f6130bc3cf65f56a618888ce9d5ea704fa10b462be126ad053e80e553d6d8b7  boost_1_68_0.tar.bz2" | shasum -a 256 -c -
          tar xjf boost_1_68_0.tar.bz2
          cd boost_1_68_0
          # toolset=clang, not the auto-detected "darwin" one: on macOS b2
          # picks darwin and passes -fcoalesce-templates, an Apple GCC flag
          # current clang rejects outright.
          ./bootstrap.sh --prefix="$BOOST_PREFIX" --with-toolset=clang \
            --with-libraries=system,filesystem,program_options,thread,chrono,test
          # A 2018 boost against a current clang defaulting to gnu++17 trips over
          # things C++17 removed, exactly as it did cross-compiling for Android.
          # -Wno-enum-constexpr-conversion: boost 1.68's MPL assigns -1 to an
          # enum, which clang 16+ made an error rather than a warning.
          ./b2 -j"$(sysctl -n hw.ncpu)" toolset=clang \
            cxxflags="-std=c++11 -Wno-enum-constexpr-conversion" \
            linkflags="-std=c++11" link=static \
            runtime-link=shared threading=multi variant=release install

      # Homebrew dropped berkeley-db@4, and the newer formulae are not a
      # substitute: BDB 5 writes a different on-disk format, so a wallet.dat
      # produced here would not open in any other iXcoin Core build. Build 4.8
      # from source instead, the way Bitcoin's own release process does.
      - name: Build Berkeley DB 4.8
        run: |
          set -euxo pipefail
          BDB_PREFIX="$HOME/bdb4"
          mkdir -p "$BDB_PREFIX" && cd "$(mktemp -d)"
          curl -fsSLO https://download.oracle.com/berkeley-db/db-4.8.30.NC.tar.gz
          echo "12edc0df75bf9abd7f82f821795bcee50f42cb2e5f76a6a281b85732798364ef  db-4.8.30.NC.tar.gz" | shasum -a 256 -c -
          tar xzf db-4.8.30.NC.tar.gz
          cd db-4.8.30.NC
          # 4.8 predates C11 <stdatomic.h>; these names now collide with the
          # compiler builtins.
          sed -i '' 's/__atomic_compare_exchange/__atomic_compare_exchange_db/' dbinc/atomic.h
          sed -i '' 's/atomic_init/atomic_init_db/' dbinc/atomic.h mp/mp_region.c mp/mp_mvcc.c mp/mp_fget.c mutex/mut_method.c mutex/mut_tas.c
          cd build_unix
          # 4.8 predates arm64 Darwin, so its mutex probe (which compiles *and
          # runs* a test) finds nothing and it errors out instead of falling
          # back. Name the implementation explicitly; macOS is pthreads.
          ../dist/configure --enable-cxx --disable-shared --with-pic \
            --disable-replication --with-mutex=POSIX/pthreads \
            --prefix="$BDB_PREFIX"
          make -j"$(sysctl -n hw.ncpu)"
          make install

      # The Qt GUI requires protobuf for BIP70 payment requests, and 0.14 has
      # no switch to turn that off. Modern protobuf is a different library
      # generation entirely, so pin the same 2.6.1 the depends system gives the
      # Linux and Windows builds -- hash taken from depends/packages.
      - name: Build protobuf 2.6.1
        run: |
          set -euxo pipefail
          PB_PREFIX="$HOME/protobuf261"
          mkdir -p "$PB_PREFIX" && cd "$(mktemp -d)"
          curl -fsSLO https://github.com/protocolbuffers/protobuf/releases/download/v2.6.1/protobuf-2.6.1.tar.bz2
          echo "ee445612d544d885ae240ffbcbf9267faa9f593b7b101f21d58beceb92661910  protobuf-2.6.1.tar.bz2" | shasum -a 256 -c -
          tar xjf protobuf-2.6.1.tar.bz2
          cd protobuf-2.6.1
          # 2.6.1 predates C++11 as a default and uses std::auto_ptr, so keep
          # the standard where those still exist.
          ./configure --prefix="$PB_PREFIX" --disable-shared --with-pic \
            CXXFLAGS="-std=c++11"
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Configure
        run: |
          set -euxo pipefail
          BDB_PREFIX="$HOME/bdb4"
          QT_PREFIX="$(brew --prefix qt@5)"
          SSL_PREFIX="$(brew --prefix openssl@3)"
          BOOST_PREFIX="$HOME/boost168"
          # Homebrew's prefix is /opt/homebrew on Apple silicon and /usr/local
          # on Intel, and clang searches neither by default -- which is why
          # configure could not find boost/version.hpp and reported it as "no
          # working boost sleep implementation".
          BREW_PREFIX="$(brew --prefix)"
          PB_PREFIX="$HOME/protobuf261"
          export PKG_CONFIG_PATH="$SSL_PREFIX/lib/pkgconfig:$QT_PREFIX/lib/pkgconfig:$PB_PREFIX/lib/pkgconfig:$BREW_PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export PATH="$PB_PREFIX/bin:$PATH"
          export PATH="$QT_PREFIX/bin:$PATH"
          ./autogen.sh
          ./configure \
            --with-gui=qt5 \
            --disable-tests \
            --disable-bench \
            --with-boost="$BOOST_PREFIX" \
            BDB_CFLAGS="-I$BDB_PREFIX/include" \
            BDB_LIBS="-L$BDB_PREFIX/lib -ldb_cxx-4.8" \
            CXXFLAGS="-Wno-enum-constexpr-conversion" \
            CPPFLAGS="-I$BDB_PREFIX/include -I$SSL_PREFIX/include -I$BOOST_PREFIX/include -I$BREW_PREFIX/include" \
            LDFLAGS="-L$BDB_PREFIX/lib -L$SSL_PREFIX/lib -L$BOOST_PREFIX/lib -L$BREW_PREFIX/lib"

      # configure reports "No working boost sleep implementation found" for any
      # failure in that probe, and the actual compiler error only exists in
      # config.log — which is not otherwise visible from a CI run.
      - name: Show config.log on failure
        if: failure()
        run: |
          echo "=== boost sleep probe ==="
          awk '/sleep_for/,0' config.log | grep -E "error:|undefined|ld:" | head -40 || true
          echo "=== last 80 lines ==="
          tail -80 config.log || true

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Smoke test
        run: |
          set -euxo pipefail
          ./src/ixcoind --version
          ./src/ixcoin-cli --version
          DD="$(mktemp -d)"
          printf 'regtest=1\nserver=1\nrpcuser=t\nrpcpassword=t\nlisten=0\nrpcport=18557\n' > "$DD/ixcoin.conf"
          ./src/ixcoind -datadir="$DD" -daemon
          for i in $(seq 1 30); do
            ./src/ixcoin-cli -datadir="$DD" -rpcport=18557 -rpcuser=t -rpcpassword=t getblockchaininfo >/dev/null 2>&1 && break
            sleep 2
          done
          CLI="./src/ixcoin-cli -datadir=$DD -rpcport=18557 -rpcuser=t -rpcpassword=t"
          $CLI getblockchaininfo
          $CLI getnetworkinfo | grep subversion
          # The wallet and the miner must both work, not just the daemon start.
          ADDR="$($CLI getnewaddress)"
          $CLI generatetoaddress 1 "$ADDR"
          test "$($CLI getblockcount)" = "1"
          $CLI stop

      - name: Package .dmg
        run: make deploy || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ixcoin-macos-${{ matrix.arch }}
          path: |
            ixcoin-core/*.dmg
            ixcoin-core/src/ixcoind
            ixcoin-core/src/ixcoin-cli
            ixcoin-core/src/ixcoin-tx
            ixcoin-core/src/qt/ixcoin-qt
          if-no-files-found: warn
